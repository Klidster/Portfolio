<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastries | Café Lehte</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
    <nav class="navbar">
        <a href="index.html#home" class="logo">
        <img src="images/logo.png" alt="Café Lehte logo">
        </a>
        <ul class="nav-links">
        <li><a href="index.html#home">Menu</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        </ul>
        <button class="menu-toggle" id="menu-toggle">☰</button>
    </nav>
    </header>

    <main class="menu-page">
        <section class="item-section">
            <h1 class="page-title">Pastries</h1>
            <div class="item-grid">

            <div class="item-card pastry-croissant">
                <button class="item-toggle">
                <span class="item-name">Butter Croissant</span>
                </button>
                <div class="item-description">
                Light, flaky, and buttery with a crisp golden finish, perfect with coffee in the morning.
                </div>
            </div>

            <div class="item-card pastry-roll">
                <button class="item-toggle">
                <span class="item-name">Cinnamon Roll</span>
                </button>
                <div class="item-description">
                Soft baked layers with cinnamon spice and a sweet glaze for a cosy treat.
                </div>
            </div>

            <div class="item-card pastry-tart">
                <button class="item-toggle">
                <span class="item-name">Berry Tart</span>
                </button>
                <div class="item-description">
                A crisp pastry base filled with cream and topped with fresh berries for a light dessert.
                </div>
            </div>

            </div>
        </section>
    </main>

  <script src="script.js"></script>
</body>
</html>
